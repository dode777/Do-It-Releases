     그림은 홈페이지와 같은 것(dode777.github.io 의 scripts/og-do-it.html 에서 만든 og-do-it.png) -->

<meta name="mobile-web-app-capable" content="yes">
<!-- 홈 화면에 추가할 때 기본 이름 -->
<meta name="apple-mobile-web-app-title" content="두잇">
<!-- black(0.1.8): 상태 표시줄을 앱 위의 검은 띠로 둔다(내용은 그 아래에서 시작). 홈 화면 앱에서는 앱 화면 위 두 모서리를 둥글게(22px)
     깎고 바깥을 검정으로 이어(app.css html.ios-home, src/platform/appFeel.ts markIosHome) 띠가 기기 베젤처럼 보이게 한다.
     default 는 iOS 26 에서 띠 색이 theme-color 가 아니라 시스템 라이트/다크(연회색·검정)로 실행 때 정해져 앱 색과 어긋났고,
     black-translucent(시계 줄까지 채우기)는 창 높이가 짧아지는 문제(WebKit 301108)가 있어 쓰지 않는다.
     이 값은 홈 화면에 추가하는 순간 굳는다 — 이미 추가한 사람은 지우고 다시 추가해야 바뀐다(먼저 백업) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<!-- 홈 화면 앱(navigator.standalone === true)이면 첫 그림 전에 html.ios-home 을 단다. 모듈(src/main.ts)은 지연 실행이라 거기서 달면
     WebKit 이 그 전에 한 프레임(네모난 종이 화면)을 칠할 수 있다. 같은 조건을 src/platform/appFeel.ts markIosHome 이 다시 확인한다
     (조건이 같은지 tests/unit/appfeel.test.ts 가 본다).
     theme-color(안드로이드 상태 표시줄 색)도 여기서 만든다: 처음은 종이색이고 앱·스플래시가 지금 보이는 색으로 바꾼다(src/platform/theme.ts).
     홈 화면 앱은 처음부터 검정이고 바뀌지 않는다(0.2.0) — 띠가 가끔 회색으로 나온 제보가 있어, iOS 26+ 가 theme-color 를 가끔 띠에
     반영하는 것으로 보고 반영돼도 검정이게 한다. 정적 meta(종이색)를 두고 뒤에서 바꾸면 파싱된 순간 잠깐 종이색이 되므로, 조건을 보고
     처음부터 한 값으로 만든다.
     manifest 도 여기서 고른다(0.2.0): 아이폰·아이패드(apple — src/platform/device.ts isIOS 와 같은 조건, iPadOS 의 데스크톱 UA 포함)는
     theme_color·background_color 가 검정인 manifest-ios.webmanifest, 그 밖(안드로이드 설치 앱이 쓴다)은 종이색 manifest.webmanifest.
     Safari 는 "홈 화면에 추가" 하는 순간(= 탭에서, standalone 이 아닐 때) 값을 읽어 굳히므로 standalone 이 아니라 기기로 가른다.
     Safari 탭(iOS 26+)의 위·아래 막대 색은 theme-color 가 아니라 가장자리 띠(body 끝 .edge)가 정한다 — 아이폰·아이패드 브라우저 탭
     (apple 이고 standalone 이 아님)이면 html.ios-tab 을 달아 그때만 색 따라가는 띠를 둔다(안드로이드는 띠 없음). 홈 화면 앱(ios-home)은 위 띠만
     불투명 검정으로 둔다(0.2.1 — iOS 26 새 홈 화면 앱이 상단 막대를 페이지 색으로 칠해 흰색·회색으로 나왔다, app.css 위 베젤 절) -->
<script>(function () { var ios = navigator.standalone === true, apple = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1), m = document.createElement('meta'), l = document.createElement('link'); if (ios) document.documentElement.classList.add('ios-home'); else if (apple) document.documentElement.classList.add('ios-tab'); m.name = 'theme-color'; m.content = ios ? '#000000' : '#F7F4F0'; document.head.appendChild(m); l.rel = 'manifest'; l.href = apple ? './manifest-ios.webmanifest' : './manifest.webmanifest'; document.head.appendChild(l); })();</script>
