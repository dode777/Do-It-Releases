name: Notify homepage

# 릴리스가 게시·삭제되거나 릴리스 노트(UPDATE-NOTES.md · UPDATE-NOTES.en.md)가 바뀌면
# 홈페이지(dode777/dode777.github.io)의 Rebuild site 워크플로를 부른다.
#
# 홈페이지는 빌드할 때 이 저장소의 UPDATE-NOTES 와 버전별 latest.yml 을 읽어 버전·릴리스 목록을
# 만든다. 그래서 "읽는 것"은 자동이지만 "다시 빌드하는 것"은 누군가 불러 줘야 한다 — 그 신호를
# 보내는 곳을 릴리스 저장소 한 곳으로 모은다(Bible-OnAir-Releases · Do-It-Releases 에 같은 파일).
#
# 필요한 시크릿: HOMEPAGE_DISPATCH_TOKEN
#   dode777/dode777.github.io 에 Contents: Read and write 인 fine-grained PAT.
#   없으면 이 워크플로가 실패로 표시된다(홈페이지가 갱신되지 않았다는 것을 놓치지 않게).
#
# 릴리스 게시(release: published)는 소스 저장소의 Release 워크플로가 PAT 로 게시할 때 발생한다.
# (기본 GITHUB_TOKEN 으로 만든 이벤트는 다른 워크플로를 깨우지 않지만 PAT 로 만든 것은 깨운다.)
on:
  release:
    types: [published, deleted]
  push:
    branches: [main]
    paths:
      - UPDATE-NOTES.md
      - UPDATE-NOTES.en.md
  workflow_dispatch:

permissions: {}

concurrency:
  group: notify-homepage
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 홈페이지 Rebuild site 요청
        env:
          GH_TOKEN: ${{ secrets.HOMEPAGE_DISPATCH_TOKEN }}
          HOMEPAGE_REPO: dode777/dode777.github.io
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::HOMEPAGE_DISPATCH_TOKEN 시크릿이 없습니다. $HOMEPAGE_REPO 에 Contents: Read and write 인 fine-grained PAT 를 이 저장소의 Settings › Secrets and variables › Actions 에 등록하세요. 그 전까지는 홈페이지 저장소의 Actions › Rebuild site 를 직접 실행해야 합니다."
            exit 1
          fi
          gh api "repos/$HOMEPAGE_REPO/dispatches" -f event_type=update-notes
          echo "홈페이지 Rebuild site 를 요청했습니다 (${GITHUB_EVENT_NAME})."
